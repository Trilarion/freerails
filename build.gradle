import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'application'
}

group = 'org.freerails'
version = '0.4.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

sourceSets {
    tools
}

dependencies {
    implementation 'ch.qos.reload4j:reload4j:1.2.27' // replacement of log4j:log4j:1.2.17
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.jetbrains:annotations:26.1.0'
    testImplementation 'junit:junit:4.13.2'
    toolsImplementation sourceSets.main.output
}

application {
    mainClass = 'freerails.client.launcher.LauncherFrame'
}

test {
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                 'Main-Class': 'freerails.client.launcher.LauncherFrame'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

def versionFile = layout.projectDirectory.file("src/main/java/freerails/Version.java").asFile
def projectVersion = project.version

tasks.register('generateVersionInfo') {
    outputs.file versionFile
    outputs.upToDateWhen { false }

    doLast {
        String gitRevision = providers.exec {
            commandLine("git", "rev-parse", "--short", "HEAD")
        }.standardOutput.asText.get().trim()
        def diffResult = providers.exec {
            commandLine("git", "diff-index", "--quiet", "HEAD", "--")
            ignoreExitValue = true
        }.result.get()
        if (diffResult.exitValue != 0 && diffResult.exitValue != 1) {
            throw new GradleException("git diff-index failed with exit code ${diffResult.exitValue}")
        }
        if (diffResult.exitValue == 1) {
            gitRevision += "-M"
        }

        SimpleDateFormat sdfDate = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss")
        String date = sdfDate.format(new Date())

        versionFile.write(
                """
package freerails;

public final class Version {
    public static final String VERSION = "$projectVersion";
    public static final String GIT_REVISION = "$gitRevision";
    public static final String CREATION_DATE = "$date";
}
""")
    }
}

tasks.named('jar') {
    dependsOn tasks.named('generateVersionInfo')
}

tasks.named('compileJava') {
    mustRunAfter tasks.named('generateVersionInfo')
}