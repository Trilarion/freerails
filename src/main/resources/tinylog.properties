level = info

writerFile = rolling file
writerFile.level = info
writerFile.file = freerails.log
writerFile.append = true
writerFile.policies = size: 10mb
writerFile.backups = 10
writerFile.exception = org.tinylog.throwable.StripThrowableFilter:java|javax|sun|jdk|org.tinylog|com.google.gson|org.apache.commons.io|org.jetbrains.annotations
writerFile.format = {date: yyyy-MM-dd HH:mm:ss} {level|min-size=5} {tag}:{line} - {message}
